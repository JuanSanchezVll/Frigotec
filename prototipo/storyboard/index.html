<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Storyboard — Portal Frigotec</title>
<style>
  :root{
    --ink:#1A1A1A; --paper:#fff; --accent:#FF6A00; --accentDeep:#D14F00;
    --bg:#141414; --bg2:#1F1F1F; --muted:#9A9A9A;
    --hand:"Ink Free","Segoe Print","Comic Sans MS",cursive;
    --sans:"Segoe UI",Inter,system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);font-family:var(--sans);padding:26px 22px 44px}

  header{max-width:1500px;margin:0 auto 20px;display:flex;align-items:center;
         justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .mark{width:52px;height:52px;border-radius:10px;background:var(--accent);
               display:flex;align-items:center;justify-content:center;flex:none;
               box-shadow:0 4px 14px rgba(255,106,0,.32)}
  .brand h1{margin:0;color:#fff;font-size:16px;letter-spacing:.24em;font-weight:700}
  .brand p{margin:3px 0 0;color:#8A8A8A;font-size:12px;letter-spacing:.05em}
  header .title{color:#fff;font-size:36px;font-weight:800;letter-spacing:.15em;margin:0;line-height:1}
  header .title span{color:var(--accent)}

  .grid{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}

  .panel{position:relative;border-radius:7px;overflow:hidden;background:#fff;
         box-shadow:0 5px 20px rgba(0,0,0,.45)}
  .panel svg{display:block;width:100%;height:auto}
  .num{position:absolute;top:0;left:0;z-index:8;background:var(--ink);color:#fff;
       font-size:11px;font-weight:700;padding:5px 11px;border-radius:0 0 7px 0;letter-spacing:.09em}
  .cap{position:absolute;z-index:7;left:11px;right:11px;top:11px;background:#fff;
       border:2.5px solid var(--ink);border-radius:4px;padding:16px 11px 10px;
       font-family:var(--hand);font-size:13.5px;font-weight:700;line-height:1.34;color:#000;
       text-transform:uppercase;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
  .cap.bot{top:auto;bottom:11px}

  .bub{position:absolute;z-index:7;background:#fff;border:2.5px solid var(--ink);
       font-family:var(--hand);font-size:12.5px;font-weight:700;line-height:1.34;padding:13px 11px 8px;
       text-align:center;text-transform:uppercase;color:#000}
  .bub.say{border-radius:8px}
  .bub.say::after{content:"";position:absolute;bottom:-13px;left:20px;width:0;height:0;
      border:7px solid transparent;border-top:13px solid var(--ink)}
  .bub.say::before{content:"";position:absolute;bottom:-8px;left:22px;width:0;height:0;z-index:1;
      border:5px solid transparent;border-top:10px solid #fff}
  .bub.say.r::after{left:auto;right:20px}
  .bub.say.r::before{left:auto;right:22px}
  .bub.think{border-radius:20px}
  .bub.think i,.bub.think u{position:absolute;background:#fff;border:2.5px solid var(--ink);
       border-radius:50%;display:block}
  .bub.think i{width:11px;height:11px;bottom:-15px;left:14px}
  .bub.think u{width:6px;height:6px;bottom:-25px;left:8px}
  .bub.think.r i{left:auto;right:14px}
  .bub.think.r u{left:auto;right:8px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff">
        <path d="M21.7 18.6l-6.1-6.1a5.5 5.5 0 00-7-7l3.2 3.2-2.1 2.1-3.2-3.2a5.5 5.5 0 007 7l6.1 6.1a1.1 1.1 0 001.5 0l.6-.6a1.1 1.1 0 000-1.5z"/>
        <circle cx="6" cy="18" r="2.2"/>
      </svg>
    </div>
    <div><h1>PORTAL FRIGOTEC</h1><p>InteliView · Jornada do cliente em 9 quadros</p></div>
  </div>
  <h2 class="title">STORY<span>BOARD</span></h2>
</header>

<div class="grid" id="grid"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   BIBLIOTECA DE ILUSTRAÇÃO
   ══════════════════════════════════════════════════════════════ */
const W = 400, H = 290;                      // viewBox de cada quadro

const P = {
  skin:  {l:"#F7CBA4", m:"#E8B084", d:"#C98C63"},
  skin2: {l:"#D9A173", m:"#C1885C", d:"#9E6A44"},
  skin3: {l:"#8C5E3C", m:"#754B2E", d:"#5C3A23"},
  hairD:"#2A1F18", hairM:"#4A3324", hairL:"#8C6239", hairG:"#6E6E6E",
  steel:{l:"#D9E0E6", m:"#BAC5CE", d:"#96A3AE", x:"#76838E"},
  warm :{l:"#F6F0E7", m:"#E9DCCA", d:"#D6C3A9"},
  cool :{l:"#E7EFF4", m:"#D0DFE8", d:"#B2C7D5"},
  teal :{l:"#5E9CAE", m:"#4A8194", d:"#376575"},
  navy :{l:"#43596F", m:"#334657", d:"#25333F"},
  plum :{l:"#9A6486", m:"#7E4F6C", d:"#623C54"},
  sage :{l:"#84A98C", m:"#688A70", d:"#4E6B55"},
  or   :{l:"#FF9147", m:"#FF6A00", d:"#D14F00", p:"#FFE0C7"},
  ok   :{m:"#2E9E5B", l:"#E3F5E9"},
  bad  :"#D94F45",
  ink:"#1C1C1C", ink2:"#3A3A3A", line:"#D8DEE3"
};

const esc = s => String(s);
const g = (t, a="") => `<g ${a}>${t}</g>`;
const el = (n, a) => `<${n} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")}/>`;
const rect = (x,y,w,h,f,r=0,extra="") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${extra}/>`;
const circ = (cx,cy,r,f,extra="") => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${extra}/>`;
const ell  = (cx,cy,rx,ry,f,extra="") => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${extra}/>`;
const path = (d,f="none",extra="") => `<path d="${d}" fill="${f}" ${extra}/>`;
const line = (x1,y1,x2,y2,s,w=2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;
const txt  = (x,y,t,o={}) => `<text x="${x}" y="${y}" font-family="${o.f||'Segoe UI, Arial'}" font-size="${o.s||10}" font-weight="${o.w||700}" fill="${o.c||P.ink}" text-anchor="${o.a||'start'}" letter-spacing="${o.ls||0}">${t}</text>`;

/* ---------- sombra de chão ---------- */
const groundShadow = (cx,cy,rx,ry=6,op=.13) => ell(cx,cy,rx,ry,"#000",`opacity="${op}"`);

/* ---------- rostos ---------- */
function face(exp, skin){
  const eye = (x) => `${ell(x,0,2.6,3.1,P.ink)}${circ(x+.9,-1.1,.9,"#fff",'opacity=".9"')}`;
  let brows, mouth, extra="";
  switch(exp){
    case "worried":
      brows = `${path("M-9.5,-8 Q-6.5,-10.5 -3.2,-8.6","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M9.5,-8 Q6.5,-10.5 3.2,-8.6","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = path("M-4.5,8.5 Q0,5.2 4.5,8.5","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`);
      extra = path("M12,-4 q3.2,4.6 3.2,7 a3.2,3.2 0 0 1 -6.4,0 q0,-2.4 3.2,-7","#6FC0EE");
      break;
    case "confused":
      brows = `${path("M-10,-9.4 Q-6.4,-11.4 -3,-9.4","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M3,-10.6 Q6.6,-8.4 10,-10.2","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = path("M-4.6,7.6 q2.3,-2.4 4.6,0 t4.6,0","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round" fill="none"`);
      break;
    case "focused":
      brows = `${path("M-10,-9 L-3,-10","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M3,-10 L10,-9","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = path("M-3.4,7.6 L3.4,7.6","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`);
      break;
    case "tired":
      brows = `${path("M-10,-8.4 Q-6.4,-10 -3,-8.8","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M3,-8.8 Q6.4,-10 10,-8.4","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = path("M-4,8.4 Q0,6.4 4,8.4","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`);
      break;
    case "big": // sorriso aberto
      brows = `${path("M-10,-10.4 Q-6.4,-12.4 -3,-10.6","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M3,-10.6 Q6.4,-12.4 10,-10.4","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = `${path("M-5.4,6.2 a5.4,5.4 0 0 0 10.8,0 z",P.ink)}${path("M-3.4,9.6 a3.6,3.6 0 0 0 6.8,0 z","#E9748A")}`;
      break;
    default: // happy
      brows = `${path("M-10,-10 Q-6.4,-11.8 -3,-10.2","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}
               ${path("M3,-10.2 Q6.4,-11.8 10,-10","none",`stroke="${P.ink}" stroke-width="2.1" stroke-linecap="round"`)}`;
      mouth = path("M-4.6,6.4 Q0,10.2 4.6,6.4","none",`stroke="${P.ink}" stroke-width="2.2" stroke-linecap="round"`);
  }
  const blush = `${ell(-10.5,4,3.6,2.1,"#E8836B",'opacity=".28"')}${ell(10.5,4,3.6,2.1,"#E8836B",'opacity=".28"')}`;
  const nose  = path("M0,1.4 q1.8,2.4 -0.6,3","none",`stroke="${skin.d}" stroke-width="1.5" stroke-linecap="round"`);
  return blush + eye(-6.4) + eye(6.4) + brows + nose + mouth + extra;
}

/* ---------- cabelos ---------- */
function hair(style, c1, c2){
  switch(style){
    case "buzz":   return path("M-15.6,-4 a15.6,15.6 0 0 1 31.2,0 q-2,-9 -15.6,-9 t-15.6,9 z",c1);
    case "short":  return `${path("M-16,-2 a16,16 0 0 1 32,0 q1.6,-13.4 -16,-13.4 T-16,-2 z",c1)}
                           ${path("M-16,-2 q-1,-10 6,-13 -2,5 1,7 -5,2 -7,6 z",c2,'opacity=".55"')}`;
    case "messy":  return `${path("M-16.4,-3 q-1.4,-14 16.4,-14 t16.4,14 q-2.6,-6.4 -7,-6 -1.6,-3.6 -6,-2.4 -3.4,-3.4 -8.4,-0.6 -4.6,1 -6,3 -3.4,0.6 -5.4,6 z",c1)}`;
    case "bob":    return `${path("M-17,6 q-2.6,-23 17,-23 t17,23 q-1.4,-9 -5,-11 -6,3 -12,3 t-12,-3 q-3.6,2 -5,11 z",c1)}
                           ${path("M-17,6 q-1,-14 5,-19 -3,8 -1,19 z",c2,'opacity=".5"')}`;
    case "pony":   return `${path("M-16,-1 q-1,-16 16,-16 t16,16 q-1,-11 -16,-11 T-16,-1 z",c1)}
                           ${path("M14,-6 q11,3 10,15 -1,9 -7,11 4,-9 1,-16 -2,-6 -6,-7 z",c1)}`;
    case "curly":  return `${circ(-11,-11,7,c1)+circ(0,-15,7.6,c1)+circ(11,-11,7,c1)+circ(-15,-4,6,c1)+circ(15,-4,6,c1)+path("M-16,-2 a16,16 0 0 1 32,0 q0,-9 -16,-9 t-16,9 z",c1)}`;
    case "cap":    return `${path("M-17,-5 q0,-13 17,-13 t17,13 z",P.or.m)}${path("M-19,-5 q19,-4 38,0 q0,3 -19,3 t-19,-3 z",P.or.d)}`;
    case "chef":   return `${path("M-15,-4 h30 v-6 q7,-1 7,-8 0,-7 -8,-6 -1,-6 -8,-6 -6,-4 -12,0 -7,0 -8,6 -8,-1 -8,6 0,7 7,8 z","#FBFBFB")}
                           ${path("M-15,-10 h30 v6 h-30 z","#EFEFEF")}`;
    default: return "";
  }
}

/* ---------- personagem (meio corpo) ---------- */
function person(o){
  const {x=0, y=0, s=1, skin=P.skin, hairStyle="short", hc1=P.hairD, hc2=P.hairL,
         shirt=P.teal, exp="happy", flip=false, arm="none", shadow=true} = o;
  const S = [];
  if (shadow) S.push(groundShadow(0, 64, 40, 7, .12));
  // torso
  S.push(path("M-31,64 q0,-32 12,-40 h38 q12,8 12,40 z", shirt.m));
  S.push(path("M-31,64 q0,-32 12,-40 h9 q-9,10 -9,40 z", shirt.d, 'opacity=".45"')); // sombra lateral
  S.push(path("M-11,24 h22 q4,3 5,7 -8,7 -16,7 t-16,-7 q1,-4 5,-7 z", shirt.l)); // gola
  // pescoço
  S.push(path("M-8,14 h16 v12 q-8,5 -16,0 z", skin.d));
  S.push(path("M-8,14 h16 v6 q-8,3 -16,0 z", skin.d, 'opacity=".7"'));
  // cabeça
  S.push(path("M-16,-2 q0,-17 16,-17 t16,17 q0,19 -16,19 T-16,-2 z", skin.l));
  S.push(path("M9,-14 q7,5 7,12 0,12 -8,16 5,-8 5,-16 0,-8 -4,-12 z", skin.m, 'opacity=".5"'));
  S.push(`<g>${face(exp, skin)}</g>`);
  S.push(hair(hairStyle, hc1, hc2));
  // orelhas
  S.push(ell(-16.4,1,2.6,3.4,skin.m)); S.push(ell(16.4,1,2.6,3.4,skin.m));
  // braços
  if (arm === "up")      S.push(path("M22,44 q17,-6 15,-24","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`) + circ(37,19,6.4,skin.l));
  if (arm === "phone")   S.push(path("M22,46 q16,-2 17,-16","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`));
  if (arm === "point")   S.push(path("M22,44 q20,-3 26,-14","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`) + circ(49,29,6,skin.l));
  if (arm === "chin")    S.push(path("M20,48 q14,4 16,-8 1,-6 -4,-9","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`) + circ(31,27,6.2,skin.l));
  if (arm === "out")     S.push(path("M22,44 q22,2 30,-4","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`));
  if (arm === "outL")    S.push(path("M-22,44 q-22,2 -30,-4","none",`stroke="${shirt.m}" stroke-width="12" stroke-linecap="round"`));
  return `<g transform="translate(${x},${y}) scale(${flip?-s:s},${s})">${S.join("")}</g>`;
}

/* ---------- props ---------- */
function tiledWall(w,h,c1,c2,step=42){
  let l="";
  for(let x=0;x<=w;x+=step) l+=line(x,0,x,h,c2,1.6);
  for(let y=0;y<=h;y+=step) l+=line(0,y,w,y,c2,1.6);
  return rect(0,0,w,h,c1)+l;
}
function fryer(x,y,s=1,on=false){
  const c=P.steel;
  return `<g transform="translate(${x},${y}) scale(${s})">
    ${rect(-58,-4,116,74,c.m,4)}
    ${rect(-58,-4,116,13,c.d,4)}
    ${rect(-52,14,48,32,c.x,3)}${rect(4,14,48,32,c.x,3)}
    ${rect(-48,18,40,24,on?"#E8A93C":"#8E9AA4",2)}${rect(8,18,40,24,on?"#E8A93C":"#8E9AA4",2)}
    ${rect(-52,50,104,4,c.d,2)}
    ${circ(-40,62,5.4,c.d)}${circ(-22,62,5.4,c.d)}
    ${rect(-58,-4,10,74,c.l,4,'opacity=".35"')}
    ${on?`${path("M-28,10 q-5,-8 0,-14 5,6 0,14","#fff",'opacity=".5"')}${path("M22,10 q-5,-8 0,-14 5,6 0,14","#fff",'opacity=".5"')}`:""}
  </g>`;
}
function hood(x,y,w){
  return `<g transform="translate(${x},${y})">
    ${path(`M0,0 h${w} l-14,26 h-${w-28} z`,P.steel.d)}
    ${rect(6,26,w-28,7,P.steel.x,2)}
  </g>`;
}
function burst(x,y,r,c=P.or.m){
  let d="";
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6, rr=i%2?r*.52:r;
    d+=(i?"L":"M")+(x+Math.cos(a)*rr).toFixed(1)+","+(y+Math.sin(a)*rr).toFixed(1);
  }
  return path(d+"Z",c)+txt(x,y+7,"!",{s:r*1.05,a:"middle",c:"#fff",w:900});
}
function laptop(x,y,s,screen){
  return `<g transform="translate(${x},${y}) scale(${s})">
    ${rect(-84,-58,168,108,"#20262B",7)}
    ${rect(-76,-50,152,92,"#F7F9FA",3)}
    <g transform="translate(-76,-50)">${screen}</g>
    ${path("M-98,50 h196 q-4,10 -14,10 h-168 q-10,0 -14,-10 z","#2C343A")}
    ${rect(-18,50,36,4,"#171C20",2)}
  </g>`;
}
function phone(x,y,s,screen,rot=0,pw=50,ph=92){
  const bw=pw+10, bh=ph+16;
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
    ${rect(-bw/2,-bh/2,bw,bh,"#1C2226",9)}
    ${rect(-pw/2,-ph/2,pw,ph,"#fff",4)}
    <g transform="translate(${-pw/2},${-ph/2})">${screen}</g>
    ${rect(-8,-bh/2+4,16,3,"#39424A",2)}
  </g>`;
}
function plant(x,y,s=1){
  return `<g transform="translate(${x},${y}) scale(${s})">
    ${path("M-15,0 h30 l-4,30 h-22 z","#C77B52")}${path("M-15,0 h30 v6 h-30 z","#B06A45")}
    ${path("M0,0 q-3,-22 -19,-26 1,19 19,26","#6E9A6F")}
    ${path("M0,0 q3,-26 20,-29 -1,22 -20,29","#7FAE80")}
    ${path("M0,2 q-1,-16 -8,-24 5,14 8,24","#5C8460")}
  </g>`;
}
function frame(x,y,w,h){
  return `<g transform="translate(${x},${y})">
    ${rect(0,0,w,h,"#E6DAC8",2)}${rect(4,4,w-8,h-8,"#CBD9C6",1)}
    ${path(`M6,${h-6} l${w*.3},-${h*.42} l${w*.22},${h*.24} l${w*.18},-${h*.3} l${w*.24},${h*.48} z`,"#8FAE8C")}
    ${circ(w*.74,h*.28,5,"#E8C77E")}
  </g>`;
}
function stickyWall(x,y){
  const cs=["#FFD24A","#FF9F5A","#8FD6A0","#9FC7F0","#F0A0C0"];
  let s="";
  for(let i=0;i<8;i++){
    const cx=(i%4)*46, cy=Math.floor(i/4)*46, rot=(i*37%11)-5;
    s+=`<g transform="translate(${cx},${cy}) rotate(${rot})">${rect(0,0,38,38,cs[i%5],1)}
        ${line(6,12,32,12,"#00000033",2)}${line(6,20,26,20,"#00000033",2)}${line(6,28,30,28,"#00000033",2)}</g>`;
  }
  return `<g transform="translate(${x},${y})">${s}</g>`;
}
function chip(x,y,w,label,fill=P.or.m,fc="#fff"){
  return `<g transform="translate(${x},${y})">${rect(0,0,w,24,fill,12)}${txt(w/2,16,label,{s:10.5,a:"middle",c:fc,ls:.6})}</g>`;
}
function sparkle(x,y,r,c="#FFD9B0"){
  return path(`M${x},${y-r} q${r*.24},${r*.72} ${r*.76},${r*.76} q-${r*.52},${r*.04} -${r*.76},${r*.76} q-${r*.24},-${r*.72} -${r*.76},-${r*.76} q${r*.52},-${r*.04} ${r*.76},-${r*.76} z`,c);
}
function arrow(x1,y,x2,c=P.or.m,w=3.4){
  return line(x1,y,x2-9,y,c,w)+path(`M${x2-11},${y-6.5} L${x2},${y} L${x2-11},${y+6.5} z`,c);
}

/* ══════════════════════════════════════════════════════════════
   CENAS
   ══════════════════════════════════════════════════════════════ */
const scenes = [];

/* 1 — a fritadeira parou */
scenes.push({
  cap:"Todo dia, um equipamento de cozinha profissional para de funcionar.",
  bubbles:[{t:"A fritadeira parou<br>bem no meio<br>do almoço…", cls:"think", css:"left:14px;bottom:14px;max-width:158px"}],
  art:`
    ${tiledWall(W,196,P.cool.l,P.cool.m,40)}
    ${rect(0,196,W,H-196,P.cool.d)}${rect(0,190,W,8,"#A8BECC")}

/* ---------- render ---------- */
document.getElementById("grid").innerHTML = scenes.map((s,i)=>{
  const bubbles = (s.bubbles||[]).map(b=>{
    const dots = b.cls.includes("think") ? "<i></i><u></u>" : "";
    return `<div class="bub ${b.cls}" style="${b.css}">${b.t}${dots}</div>`;
  }).join("");
  return `<div class="panel">
    <div class="num">${String(i+1).padStart(2,"0")}</div>
    <div class="cap${s.capBottom?" bot":""}">${s.cap}</div>
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${s.art}</svg>
    ${bubbles}
  </div>`;
}).join("");
