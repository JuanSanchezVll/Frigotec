name: CI

# Roda em todo push para develop/main e em todo Pull Request: testes do back-end e lint + build do front-end.
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Back-end (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend-frigotec/frigotec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes de integração
        run: chmod +x mvnw && ./mvnw -B test

  frontend:
    name: Front-end (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (sem erros)
        run: npm run lint
      - name: Build
        run: npm run build
