spring.application.name=frigotec
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.url=jdbc:h2:mem:frigotec;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.defer-datasource-initialization=true
# Dados de exemplo (data.sql): ligados por padrão (dev). Em produção defina SEED_MODE=never.
spring.sql.init.mode=${SEED_MODE:always}
# Quais arquivos de dados carregar. Padrão: base (admin + catálogo) + exemplos. Só a base: SEED_DATA=classpath:data.sql
spring.sql.init.data-locations=${SEED_DATA:classpath:data.sql,classpath:data-demo.sql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

# Swagger UI: mantém o token JWT informado no botão Authorize depois de recarregar a página.
springdoc.swagger-ui.persist-authorization=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.debug=true

app.mail.from=${MAIL_FROM:NoReplyFrigotec@gmail.com}
app.site-url=${SITE_URL:http://localhost:5173}

# JWT (SDD RN-USR-06). O segredo abaixo é SÓ de desenvolvimento; fora do ambiente dev defina JWT_SECRET e APP_AMBIENTE.
app.ambiente=${APP_AMBIENTE:dev}
app.jwt.secret=${JWT_SECRET:frigotec-segredo-de-desenvolvimento-nao-usar-em-producao}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
