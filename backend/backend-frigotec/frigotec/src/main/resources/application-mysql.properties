# Perfil "mysql": banco persistente no lugar do H2 em memória.
# Subir:  SPRING_PROFILES_ACTIVE=mysql DB_PASSWORD=... JWT_SECRET=... APP_AMBIENTE=prod ./mvnw spring-boot:run
# O MySQL de desenvolvimento sobe com `docker compose up -d` (arquivo docker-compose.yml na raiz do repositório).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/frigotec?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:frigotec}
spring.datasource.password=${DB_PASSWORD:}

# As tabelas são criadas/atualizadas pelo Hibernate a partir das entidades (o script docs/der/frigotec_mysql.sql é a referência).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=false

# Dados de exemplo desligados por padrão com banco persistente (para ligar: SEED_MODE=always).
spring.sql.init.mode=${SEED_MODE:never}

# Produção: sem console do H2, sem SQL no log e sem debug de e-mail.
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.mail.properties.mail.debug=false
